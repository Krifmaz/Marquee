name: android

# The Android app (android/): ktlint, then the kit's kit-android.yml, which builds the release APK (signed with the
# runner's throw-away debug key on a pull request), runs the unit tests and uploads the APK as the artifact
# kit-app-android, so every pull request has an APK to try. Runs when android/ or this file changes. kit-compose
# comes from the kit's GitHub Packages (read with this run's token). Shipping the APK with a release needs the four
# ANDROID_KEYSTORE_* secrets (android/README.md) and is wired into release.yml once they exist.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # the kit's ktlint (Krifmaz/kit .github/workflows/android.yml at v0.2.1)
  KTLINT_VERSION: "1.8.0"
  KTLINT_SHA256: "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75"

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: ktlint
        run: |
          curl -sSLo ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  ktlint" | sha256sum -c -
          chmod +x ktlint
          cd android && ../ktlint "**/*.kt" "**/*.kts" "!**/build/**"

  apk:
    needs: ktlint
    uses: Krifmaz/kit/.github/workflows/kit-android.yml@v0.2.1
    with:
      app-name: Marquee
