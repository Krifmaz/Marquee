# The settings table: every server setting with its environment variable and default, and for the ones on the
# Settings pages, the words and the layout of their field (the kit's
# crates/kit-server-settings README lists every option). build.rs turns this file into settings_gen.rs through kit-server-settings: the `Keys` names,
# the `TABLE` of definitions the store reads, and `SCHEMA`, which GET /api/settings/schema answers with.
#
# [sections.<id>]  a page under Settings, in nav order: title.
# [groups.<id>]    a card on a page, in page order: section, title, desc.
# [keys.<name>]    one setting: env (the environment variable that sets it and locks it in the UI), default (its
#                  TOML type is the setting's type), secret, group (the card that shows it), label, help, type,
#                  options, when, unit, min, max, step, full, advanced.

[sections.general]
title = "General"

[groups.general]
section = "general"
title = "General"
desc = "Your server's name and how long people stay signed in."

[keys.app_name]
env = "APP_NAME"
default = "Marquee"
group = "general"
label = "App name"
type = "text"

[keys.session_days]
env = "APP_SESSION_DAYS"
default = 30
group = "general"
label = "Stay signed in for (days)"
type = "number"
unit = "days"
min = 1

[keys.api_key]
env = "APP_API_KEY"
default = ""
secret = true
group = "general"
label = "API key"
type = "password"
help = "Prowlarr, Seerr, Homepage, nzb360 and LunaSea connect with this key. Use http://<this server>/radarr as Radarr's address and /sonarr as Sonarr's."

[sections.connections]
title = "Connections"

[groups.lantern]
section = "connections"
title = "Lantern"
desc = "Marquee searches and downloads through Lantern. It has no download clients or indexers of its own."

[keys.lantern_url]
env = "MARQUEE_LANTERN_URL"
default = ""
group = "lantern"
label = "Lantern address"
help = "Lantern's web address as this server reaches it, for example http://lantern:9696."
type = "text"

[keys.lantern_api_key]
env = "MARQUEE_LANTERN_API_KEY"
default = ""
secret = true
group = "lantern"
label = "Lantern API key"
help = "Lantern → Settings → API key."
type = "password"

[keys.marquee_url]
env = "MARQUEE_URL"
default = ""
group = "lantern"
label = "This server's address for Lantern"
help = "How Lantern reaches Marquee, for example http://marquee:8080. With it, Lantern says at once when a download is done; without it, Marquee asks every minute."
type = "text"

[groups.metadata]
section = "connections"
title = "Movie and TV information"
desc = "Titles, posters and episode lists come from TMDB."

[keys.tmdb_api_key]
env = "MARQUEE_TMDB_API_KEY"
default = ""
secret = true
group = "metadata"
label = "TMDB API key"
help = "A free key from themoviedb.org → Settings → API (the API Read Access Token or the v3 key)."
type = "password"

[groups.requests]
section = "general"
title = "New accounts"
desc = "The request limits a new account starts with. Each account's own limits are under Accounts."

[keys.default_role]
env = "MARQUEE_DEFAULT_ROLE"
default = "requester"
group = "requests"
label = "Role of a new account"
type = "select"
options = [["requester", "Can request"], ["viewer", "Read-only"]]

[keys.default_movie_quota]
env = "MARQUEE_DEFAULT_MOVIE_QUOTA"
default = 0
group = "requests"
label = "Movies a week (0: no limit)"
type = "number"
min = 0

[keys.default_tv_quota]
env = "MARQUEE_DEFAULT_TV_QUOTA"
default = 0
group = "requests"
label = "TV seasons a week (0: no limit)"
type = "number"
min = 0

[keys.tmdb_url]
env = "MARQUEE_TMDB_URL"
default = ""
help = "Where TMDB's API is; empty means TMDB itself. For tests and mirrors."

[groups.anime]
section = "connections"
title = "Anime"
desc = "Anime downloads are checked with ffprobe: the real audio and subtitle tracks must match what was asked for."

[keys.anime_mismatch]
env = "MARQUEE_ANIME_MISMATCH"
default = "research"
group = "anime"
label = "When the tracks don't match"
type = "select"
options = [["research", "Turn it down and search again"], ["review", "Keep it in the Review queue for a look"]]

[keys.anime_list_url]
env = "MARQUEE_ANIME_LIST_URL"
default = ""
label = "Anime mapping list address"
help = "Where the community anime mapping list is fetched from each day; empty for Fribb/anime-lists, off for never."
type = "text"

[sections.trash]
title = "TRaSH Guides"

[groups.trash]
section = "trash"
title = "TRaSH Guides"
desc = "Quality profiles, custom formats, sizes and naming come from the TRaSH Guides. Pick what you want under TRaSH (in the menu); these settings say when Marquee looks for updates."

[keys.trash_auto]
env = "MARQUEE_TRASH_AUTO"
default = true
group = "trash"
label = "Set up and update automatically"
help = "On the first start Marquee adds TRaSH's profiles; then it looks for updates on the schedule below. Your own edits are never overwritten without asking."
type = "bool"

[keys.trash_sync_hours]
env = "MARQUEE_TRASH_SYNC_HOURS"
default = 24
group = "trash"
label = "Look for updates every"
type = "number"
unit = "hours"
min = 1

# ---- end of the TRaSH track ----

# ---- Requests track: keys start with request_ or seerr_ ----

[sections.request_news]
title = "Requests"

[groups.request_notifications]
section = "request_news"
title = "Request news"
desc = "Where Marquee says that someone asked for something, that it was approved or declined, and that it's ready to watch."

[keys.request_discord_webhook]
env = "MARQUEE_REQUEST_DISCORD_WEBHOOK"
default = ""
secret = true
group = "request_notifications"
label = "Discord webhook"
help = "In Discord: channel settings → Integrations → Webhooks → New webhook → Copy webhook URL."
type = "password"

[keys.request_ntfy_url]
env = "MARQUEE_REQUEST_NTFY_URL"
default = ""
group = "request_notifications"
label = "ntfy topic address"
help = "The full address of the topic, for example https://ntfy.sh/my-marquee."
type = "text"

[keys.request_ntfy_token]
env = "MARQUEE_REQUEST_NTFY_TOKEN"
default = ""
secret = true
group = "request_notifications"
label = "ntfy access token"
help = "Only when the topic is protected: ntfy → Account → Access tokens."
type = "password"

[keys.request_anilist_url]
env = "MARQUEE_REQUEST_ANILIST_URL"
default = ""
help = "Where AniList's API is; empty means AniList itself. For tests and mirrors."

# ---- end of the requests track ----

# ---- Media servers track: keys start with jellyfin_, plex_, smtp_, signup_ or invite_ ----

# ── Media servers, sign-up and mail (media_servers.rs, account_sync.rs, invites.rs, recovery.rs, expiry.rs, mail.rs)

[sections.media]
title = "Media servers"

[groups.jellyfin]
section = "media"
title = "Jellyfin"
desc = "Marquee makes and updates each person's Jellyfin account, scans the library after an import and shows what Jellyfin already has."

[keys.jellyfin_url]
env = "MARQUEE_JELLYFIN_URL"
default = ""
group = "jellyfin"
label = "Jellyfin address"
help = "Jellyfin's web address as this server reaches it, for example http://jellyfin:8096."
type = "text"

[keys.jellyfin_api_key]
env = "MARQUEE_JELLYFIN_API_KEY"
default = ""
secret = true
group = "jellyfin"
label = "Jellyfin API key"
help = "Jellyfin → Dashboard → API Keys → +."
type = "password"

[keys.jellyfin_public_url]
env = "MARQUEE_JELLYFIN_PUBLIC_URL"
default = ""
group = "jellyfin"
label = "Jellyfin address for people"
help = "The address people open Jellyfin at, shown after they sign up. Empty: the address above."
type = "text"

[keys.jellyfin_sign_in]
env = "MARQUEE_JELLYFIN_SIGN_IN"
default = true
group = "jellyfin"
label = "Sign in with a Jellyfin account"
type = "bool"

[groups.plex]
section = "media"
title = "Plex"
desc = "Marquee shares your Plex libraries with each person who should have them, scans after an import and shows what Plex already has."

[keys.plex_url]
env = "MARQUEE_PLEX_URL"
default = ""
group = "plex"
label = "Plex address"
help = "Plex's web address as this server reaches it, for example http://plex:32400."
type = "text"

[keys.plex_token]
env = "MARQUEE_PLEX_TOKEN"
default = ""
secret = true
group = "plex"
label = "Plex token"
help = "The server owner's Plex token (support.plex.tv: Finding an authentication token)."
type = "password"

[keys.plex_sign_in]
env = "MARQUEE_PLEX_SIGN_IN"
default = true
group = "plex"
label = "Sign in with a Plex account"
type = "bool"

[keys.plex_tv_url]
env = "MARQUEE_PLEX_TV_URL"
default = ""
help = "Where plex.tv's API is; empty means plex.tv itself. For tests."

[groups.signup]
section = "media"
title = "Sign-up and accounts"
desc = "Invite links, the sign-up page, password reset mails and account expiry."

[keys.signup_public_url]
env = "MARQUEE_SIGNUP_PUBLIC_URL"
default = ""
group = "signup"
label = "Marquee's address for people"
help = "The address people open Marquee at, for example https://marquee.example.com. Invite and password reset links use it."
type = "text"

[keys.signup_media_creates]
env = "MARQUEE_SIGNUP_MEDIA_CREATES"
default = false
group = "signup"
label = "Plex or Jellyfin sign-in makes an account"
help = "On: anyone with access to your Plex or Jellyfin server can sign in and gets an account with the default role. Off: only people already linked to an account."
type = "bool"

[keys.signup_expiry_reminder_days]
env = "MARQUEE_SIGNUP_EXPIRY_REMINDER_DAYS"
default = 3
group = "signup"
label = "Remind people before their account ends (days)"
type = "number"
unit = "days"
min = 0

[keys.signup_expiry_action]
env = "MARQUEE_SIGNUP_EXPIRY_ACTION"
default = "disable"
group = "signup"
label = "When an account ends"
type = "select"
options = [["disable", "Turn it off everywhere"], ["delete", "Remove it everywhere"]]

[groups.mail]
section = "media"
title = "Mail"
desc = "For invites, password reset and expiry reminders. Without it, people can't reset their own password."

[keys.smtp_host]
env = "MARQUEE_SMTP_HOST"
default = ""
group = "mail"
label = "Mail server"
help = "For example smtp.fastmail.com."
type = "text"

[keys.smtp_port]
env = "MARQUEE_SMTP_PORT"
default = 587
group = "mail"
label = "Port"
type = "number"
min = 1
max = 65535

[keys.smtp_security]
env = "MARQUEE_SMTP_SECURITY"
default = "starttls"
group = "mail"
label = "Encryption"
type = "select"
options = [["starttls", "STARTTLS (port 587)"], ["tls", "TLS (port 465)"], ["none", "None"]]

[keys.smtp_user]
env = "MARQUEE_SMTP_USER"
default = ""
group = "mail"
label = "User name"
type = "text"

[keys.smtp_password]
env = "MARQUEE_SMTP_PASSWORD"
default = ""
secret = true
group = "mail"
label = "Password"
type = "password"

[keys.smtp_from]
env = "MARQUEE_SMTP_FROM"
default = ""
group = "mail"
label = "From address"
help = "For example Marquee <marquee@example.com>."
type = "text"

# ---- end of the media servers track ----
